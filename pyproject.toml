[project]
name = "library-enrichment"
version = "0.0.0"
description = "Thin FastMCP 4 adapter and extraction worker for the library-enrichment evidence service"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Paul Heyse" }]

# Runtime dependencies are added once their rows in
# docs/architecture/compatibility-matrix.md are `verified`. Blueprint §1.2 and §12.1 require
# exact pins with a committed lockfile -- no floors, no ranges, no `uvx ...@latest`.
#
# Verified 2026-09-13: all three resolve for requires-python >=3.14,<3.15 (see
# docs/architecture/compatibility-matrix.md and ADR 0004).
dependencies = [
  # The standalone package. NOT mcp.server.fastmcp -- rules/fastmcp-standalone-import-only.yml
  # enforces the import form in the edit loop.
  "fastmcp==4.0.3",
  # Static Python API extraction. Always with allow_inspection=False and explicit search_paths
  # (blueprint §5.2 [S12]); rules/griffe-static-only.yml enforces it.
  "griffe==2.3.0",
  # Mechanical IPC V5 worker encoding of the generated Rust Arrow contract (Plan 15).
  "pyarrow==25.0.1",
  # The adapter validates envelopes against the schema generated from the Rust wire types.
  # It is a RUNTIME dependency, not just a test one: the generated Pydantic DTOs enforce field
  # types and reject unknown fields, but datamodel-codegen does not translate the contract's
  # root `allOf` conditionals into validators -- so the DTO alone would accept a `pending`
  # envelope with no job handle. Gate C19 measures that; see enrichment_mcp.envelope.
  "jsonschema==4.26.0",
  # Authored MCP composition over generated Rust DTOs (ADR-0037); exact installed release verified.
  "pydantic==2.13.5",
]

[project.scripts]
library-enrichment-mcp = "enrichment_mcp.__main__:main"
library-enrichment-worker = "enrichment_worker.__main__:main"

[dependency-groups]
dev = [
  # ty is the Python semantic engine (blueprint §1.1, §5.4). It belongs in the lockfile, not
  # in a global `uv tool install`, so the analysed version is reproducible (§12.1).
  # pyright/mypy are installed on this workstation and are NOT admissible engines here.
  "ty==0.0.80",
  # pyrefly is admissible alongside ty (ADR-0046) and is the producer the fastmcp capability
  # skill runs for cross-references and call graphs. Pinned exactly, and in the lockfile rather
  # than a global `uv tool`, for the same reason ty is: the analysed version must be reproducible.
  "pyrefly==1.3.1",
  # Validates the frozen response envelope and the generated schemas against the fixture corpus.
  "jsonschema==4.26.0",
  "pytest==9.0.1",
  "pytest-json-report==1.5.0",
  "ruff==0.14.4",
  # Generates the Pydantic boundary DTOs from the schemas emit-schemas produces, which is the
  # second half of blueprint §6.3's one-directional chain: Rust wire types -> JSON Schema ->
  # Pydantic. Exact pin, like everything else here -- §12.1 forbids floors and ranges.
  "datamodel-code-generator==0.80.0",
  # The contract tier drives FastMCP's real async client; `asyncio_mode = "auto"` below keeps
  # those tests plain `async def` with no per-module marker boilerplate.
  "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/enrichment_mcp", "python/enrichment_worker"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["python", "tests"]
# Generated by `just schemas-generate` from the Rust wire types and never hand-edited
# (.claude/rules/generated-artifacts.md), so a style finding here has no legal remedy: the only
# way to satisfy E501 would be to shorten a Rust doc comment, letting Python's line budget
# constrain Rust documentation. ADR 0007 records the decision. This is a scoping choice about
# which files ruff governs, not a suppression of a finding in hand-written code.
# Upstream source vendored verbatim at a pinned tag by a capability repository's `acquire.py`,
# and verified by digest rather than by style (`verify.py::check_corpus`). The same reasoning as
# above applies with more force: the only way to satisfy a finding here would be to edit another
# project's released code, which would break the digest that makes the corpus evidence. Scoping,
# not suppression -- and the corpus is the larger half of these skills by file count.
extend-exclude = [
    "python/enrichment_mcp/_generated",
    ".claude/skills/*/build/acquired",
    ".claude/skills/*/content/corpus",
    # Deliberately-wrong Python: the runnable target the capability repositories' `project-*`
    # rules are pointed at, carrying the mistakes those rules exist to find. Fixing a finding
    # here would delete the fixture's reason to exist.
    ".claude/skills/*/queries/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "T20"]
# T20 (flake8-print) is deliberate: stdout is the MCP protocol channel, so a stray print()
# corrupts the session. rules/mcp-stdout-protocol-only.yml covers the same ground in the edit
# loop; this catches it in lint.
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is on the path so wire_corpus.py -- the shared C19 corpus -- is importable from
# both the contract and e2e tiers.
pythonpath = ["python", "tests", "scripts"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "live: requires network access to a real registry; opt-in, reported separately from deterministic tests",
  "client: requires a real MCP client (Codex or Claude Code); `not_run` when unavailable, never mocked",
  "sandbox: requires an operational container runtime or bwrap for the build/runtime execution profiles",
]

[tool.ty.environment]
# ty checks THIS project's own Python. Libraries under study are analysed in service-owned
# consumer capsules with their own selected interpreter, never against this environment
# (blueprint §5.4, gate P10).
python-version = "3.14"
root = ["python", "tests", "scripts"]
