[package]
name = "unified-datafusion-review"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "unified-datafusion-review"
path = "capability_probe.rs"

[workspace]

[dependencies]
datafusion = "=55.1.0"
arrow = "=59.3.0"
parquet = "=59.3.0"
object_store = "=0.13.2"
deltalake = { git = "https://github.com/delta-io/delta-rs.git", rev = "43a0cf10a313e5077c48637ad786a05359136bbb", features = ["datafusion"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"

[profile.dev]
debug = 1
