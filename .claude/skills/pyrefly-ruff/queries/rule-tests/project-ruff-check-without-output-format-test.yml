id: project-ruff-check-without-output-format
valid:
  - |
    subprocess.run(["ruff", "check", "--output-format", "json", "."], check=False)
  - |
    subprocess.run(["ruff", "format", "--check", "."], check=False)
invalid:
  - |
    subprocess.run(["ruff", "check", "--select", "F401", "."], check=False)
