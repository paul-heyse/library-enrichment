id: project-analyze-graph-trusts-exit-status
snapshots:
  ? |
    subprocess.run(["ruff", "analyze", "graph", "pkg"], check=True)
  : labels:
    - source: '["ruff", "analyze", "graph", "pkg"]'
      style: primary
      start: 15
      end: 50
    - source: analyze
      style: secondary
      start: 25
      end: 32
    - source: '"analyze"'
      style: secondary
      start: 24
      end: 33
    - source: graph
      style: secondary
      start: 36
      end: 41
    - source: '"graph"'
      style: secondary
      start: 35
      end: 42
    - source: check=True
      style: secondary
      start: 52
      end: 62
    - source: (["ruff", "analyze", "graph", "pkg"], check=True)
      style: secondary
      start: 14
      end: 63
