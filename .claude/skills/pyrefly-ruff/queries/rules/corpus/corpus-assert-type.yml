# The conformance suite states its expectations with assert_type.
id: corpus-assert-type
language: python
severity: hint
message: A conformance expectation — this is the type the specification requires here.
note: |
  The typing conformance suite in content/corpus/conformance/third_party/ asserts the exact type
  the specification demands at a position. Reading these is the precise way to answer "is this
  inference behaviour required, or an implementation choice", and content/catalogs/conformance.md
  records which of the 144 test files the pinned checker passes.
rule:
  pattern: assert_type($EXPR, $TYPE)
