# Generated by build/queries.py from catalogs.json and the model.
# Do not hand-edit: a re-pin rewrites this file, and a hand-edit would be lost silently.
id: project-vendored-click-import
language: python
severity: hint
message: "`click` is imported in a project that uses Typer."
note: |
  Typer 0.27.2 carries its own adapted copy of Click at `typer/_click/` and does not depend on the `click` distribution.

  An `import click` in a Typer project resolves to an unrelated copy installed for some other reason -- a different library from the one Typer runs -- and it type-checks either way. `typer.main.get_command(app)` returns a `typer._click` Command that no Click plugin accepts.

  Evidence: Requires-Dist lists shellingham, rich, annotated-doc and colorama (Windows). `click` is absent, and is not in the resolved graph.

  If you need what the import gave you, see `content/catalogs/vendored-click.md` for what Typer re-exports and what it does not.
metadata:
  generated: true
  source: catalogs.json
rule:
  any:
    - pattern: import click
    - pattern: import click as $ALIAS
    - pattern: from click import $$$NAMES
    - pattern: from click.$MOD import $$$NAMES
