# ast-grep project configuration for the FastMCP capability repository.
#
# These rules are QUESTIONS, not prohibitions. Every one is `severity: hint` and none carries a
# `fix`. They are meant to be pointed at a repository deliberately, with `-c`, and never mixed
# into an enforcement corpus where a hint becomes a gate.
#
#   model-*    query the emitted JSON under content/model  (language: json)
#   corpus-*   query upstream examples and tests           (language: python)
#   project-*  query the repository you are editing        (language: python)
ruleDirs:
  - rules
utilDirs:
  - utils
testConfigs:
  - testDir: rule-tests
    snapshotDir: __snapshots__
