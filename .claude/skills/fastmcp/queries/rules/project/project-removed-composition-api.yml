id: project-removed-composition-api
language: python
severity: hint
message: '`import_server` and `as_proxy` were removed in FastMCP 4.0.'
note: |
  Composition is now the Provider architecture. `mount()` wraps a server as a provider, and
  `fastmcp.server.create_proxy(target, ...)` replaces `as_proxy`. Both old names are absent
  from the 4.0 surface, so this fails at the call, not at import.
  See content/catalogs/extension-points.md.
metadata:
  record: removed-api
  capability: composition
rule:
  kind: call
  has:
    field: function
    kind: attribute
    has:
      field: attribute
      regex: '^(import_server|as_proxy)$'
