id: corpus-rg-test-assertion
language: rust
severity: hint
message: An upstream ripgrep integration test — executable evidence for a flag's behaviour.
note: |
  `content/corpus/ripgrep/tests/` holds ripgrep's own integration suite. When documentation and
  intuition disagree about what a flag does, these assert the answer upstream actually ships,
  and they are far more specific than the manual.

  Filter by flag name to find the tests that exercise it:
      ast-grep scan -c queries/sgconfig.yml --filter '^corpus-rg-test-assertion$' \
        content/corpus/ripgrep/tests
metadata:
  record: evidence
  capability: ripgrep-behaviour
rule:
  kind: macro_invocation
  has:
    field: macro
    regex: '^rgtest$'
