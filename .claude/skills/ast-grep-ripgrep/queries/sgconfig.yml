# ast-grep project for the ast-grep / ripgrep capability repository.
#
# This config is deliberately NOT discovered automatically. It is always passed explicitly:
#
#     ast-grep scan -c .claude/skills/ast-grep-ripgrep/queries/sgconfig.yml \
#       --filter '^project-' PATH
#
# The rules here are questions, not prohibitions. They carry `severity: hint` and no `fix`, and
# they must never be mixed into a repository's own enforcement corpus -- a hint that leaks into
# a gate becomes a policy nobody agreed to.
ruleDirs: [rules]
utilDirs: [utils]
testConfigs:
  - testDir: rule-tests
    snapshotDir: __snapshots__
