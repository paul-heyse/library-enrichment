# The SUBJECT of the cargo-metadata family: the crates the ast-grep-ripgrep skill pinned.
#
# This manifest is never built and never linked. It exists so `cargo metadata` has a workspace to
# resolve, which is the only way to learn two things that `--no-deps` against a vendored checkout
# cannot tell you:
#
#   * a package's real `source`. A registry crate read straight out of `~/.cargo/registry/src` is
#     reported as a PATH package with `source: null`, because that is what it is on disk. §1.2's
#     key wants the registry, and the registry is only visible to a resolve.
#   * a resolve graph at all. `--no-deps` sets `resolve` to null, and probe PL001 measured that a
#     null resolve is not "no dependencies" -- so without this, every dependency edge carries
#     `resolve_present = false` and §7.3's closure correctly refuses to traverse.
#
# Every one of the 23 is pinned with `=`, so the resolve reproduces the skill's set exactly rather
# than drifting to whatever is newest. `Cargo.lock` is committed for the same reason. The
# transitive packages the resolve adds are real facts about that graph and are emitted too, marked
# so `coverage` can report the skill's set as its own denominator.
#
# Generated by hand from `content/PROVENANCE.json` `pins.crates`; a mismatch is a build error in
# the adapter, not a silent difference.
[workspace]

[package]
name = "cargo-metadata-subject"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aho-corasick = "=1.1.4"
ast-grep-config = "=0.45.3"
ast-grep-core = "=0.45.3"
ast-grep-dynamic = "=0.45.3"
ast-grep-language = "=0.45.3"
ast-grep-lsp = "=0.45.3"
ast-grep-outline = "=0.45.3"
bstr = "=1.13.0"
globset = "=0.4.19"
grep = "=0.4.1"
grep-cli = "=0.1.12"
grep-matcher = "=0.1.9"
grep-pcre2 = "=0.1.10"
grep-printer = "=0.3.1"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
ignore = "=0.4.29"
memchr = "=2.8.3"
pcre2 = "=0.2.11"
regex = "=1.13.0"
regex-automata = "=0.4.15"
regex-syntax = "=0.8.11"
walkdir = "=2.5.0"
