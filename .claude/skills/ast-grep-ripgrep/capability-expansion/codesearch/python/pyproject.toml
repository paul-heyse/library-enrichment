[project]
name = "codesearch-cli"
version = "0.0.0"
description = "Typer front end over the codesearch query binary."
requires-python = ">=3.12"
dependencies = ["typer==0.27.2", "rich==15.0.0"]

[project.scripts]
codesearch = "codesearch_cli.main:main"

[dependency-groups]
dev = ["pytest==9.0.1", "ruff==0.14.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codesearch_cli"]

# Matches the surrounding repository's conventions so a file does not lint differently depending
# on which tree it is checked from.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "T20"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
