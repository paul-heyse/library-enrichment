id: recursive-cte-has-a-depth-bound
valid:
  - 'const CHAIN: &str = r"WITH RECURSIVE chain(head, depth) AS (SELECT a, 1 UNION ALL SELECT c.head, c.depth + 1 FROM chain c WHERE c.depth < 8)";'
invalid:
  - 'const CHAIN: &str = r"WITH RECURSIVE chain(head) AS (SELECT a UNION ALL SELECT c.head FROM chain c)";'
