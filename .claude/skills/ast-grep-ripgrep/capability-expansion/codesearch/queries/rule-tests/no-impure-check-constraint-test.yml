id: no-impure-check-constraint
valid:
  - 'table.add_constraint().with_constraint("off_nonneg", "off >= 0")'
  - 'table.add_constraint().with_constraint("rank_in_range", "precision_rank BETWEEN 0 AND 2")'
  - 'table.add_constraint().with_constraint(name.clone(), expr.clone())'
invalid:
  - 'table.add_constraint().with_constraint("off_valid", "is_valid_offset(off)")'
  - 'table.add_constraint().with_constraint("labelled", "lattice_label(precision_rank) = 1")'
