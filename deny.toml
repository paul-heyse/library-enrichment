# cargo-deny policy. `just deps-policy` is the gate.

[graph]
all-features = true
# Evaluate the platforms this service ships on (blueprint §2.1: Linux and macOS; a Windows
# transport is a later profile). Without this, cargo-deny evaluates every target and
# `rustls-platform-verifier`'s wasm32-only `webpki-root-certs` (CDLA-Permissive-2.0) fails the
# licence check for a crate that is never built here. Verified 2026-09-13 in a scratch crate:
# restricting targets clears it; allowing the licence would have been the wider change.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[bans]
# ADR-0043: native interface crates must have one exact type universe. The architecture
# check rejects duplicate Arrow/DataFusion/Parquet/object_store/kernel versions. Utility
# major versions are reported here; they are not coerced across unrelated upstream APIs.
multiple-versions = "warn"
wildcards = "deny"

# Blueprint §1.1: do not add a graph database, embeddings, a vector database, a GPU workload,
# a generic workflow engine, or an additional server framework to the initial implementation.
[[bans.deny]]
name = "lancedb"
reason = "Blueprint §8.4: emit portable Arrow/Parquet/JSON for the future store; no LanceDB dependency is required."

[[bans.deny]]
name = "tonic"
reason = "Blueprint §2.1: do not add gRPC to carry a small local interface."

[[bans.deny]]
name = "redis"
reason = "Blueprint §2.1: do not add Redis to carry a small local interface."

[[bans.deny]]
name = "neo4rs"
reason = "Blueprint §1.1: no graph database in the initial implementation."

[[bans.deny]]
name = "qdrant-client"
reason = "Blueprint §1.1: no vector database in the initial implementation."

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # libbz2-rs-sys, reached through parquet's bzip2 compression support. Permissive,
  # BSD-style with a no-endorsement clause.
  "bzip2-1.0.6",
  # snapshot-testing, reached through public-api. Public-domain dedication.
  "Unlicense",
]
confidence-threshold = 0.9

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/delta-io/delta-rs.git",
  "https://github.com/buoyant-data/delta-kernel-rs.git",
]
