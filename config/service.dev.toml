# Development configuration. `scripts/env.sh` points LIBENR_CONFIG here for both direnv shells
# and agent sessions, so a human and an agent run against the same settings.
#
# Derived from the frozen config/service.example.toml, which documents the full contract. Only
# the values that must differ during development are changed, and each says why. Do not edit
# the example: it is digest-verified by `just provenance-check`.
config_version = "1.0"

[service]
name = "library-enrichment"
transport = "stdio-adapter-to-unix-daemon"
# Development starts the daemon explicitly (`library-enrichmentd start`) so a test run never
# leaves a surprise process behind, and so a failure to connect is visible rather than papered
# over by an auto-start.
auto_start_daemon = false
log_level = "debug"

[storage]
layout = "content-addressed-artifacts-and-parquet-snapshots"
single_writer = true
retain_published_snapshots = true

[limits]
# Unchanged from the example. `rpc_message_bytes` in particular is the bound the NDJSON-RPC
# transport enforces (blueprint §2.1); crates/enrichment-daemon/src/rpc.rs carries the same
# value as DEFAULT_MAX_MESSAGE_BYTES.
inline_result_bytes = 12288
search_results = 12
excerpt_characters = 800
source_lines = 80
namespace_entries = 20
verification_input_bytes = 32768
inline_wait_seconds = 2
max_job_wait_seconds = 10
expensive_worker_concurrency = 2
warm_lsp_sessions = 2
rpc_message_bytes = 1048576

[freshness]
registry_ttl_seconds = 900
mutable_docs_ttl_seconds = 86400
negative_cache_ttl_seconds = 300
latest_requires_revalidation = true

[policy]
# Phase 0 implements no producers, so only `static` is enabled. podman, docker and bwrap are all
# present on this workstation, so `build` becomes enablable the moment the sandbox lands -- but
# a profile is enabled by configuration, never by a caller asking for it (blueprint §10).
enabled_profiles = ["static"]
require_sandbox_for_build = true
require_sandbox_for_runtime = true
execution_network = false
inherit_home = false
inherit_project = false
inherit_credentials = false
allow_untrusted_griffe_extensions = false
allow_arbitrary_shell = false
allow_arbitrary_filesystem_read = false

[producers.rust]
prefer_hosted_rustdoc_json = true
all_features_by_default = false
lsp = "rust-analyzer"

[producers.python]
static_api = "griffe"
allow_griffe_inspection = false
lsp = "ty"
separate_analysis_environment = true

[mcp]
native_tasks_required = false
expose_paged_read_tool = true
embedded_context7_client = false
embedded_llm = false

[skill]
name = "library-research"
automatic_project_file_creation = false
