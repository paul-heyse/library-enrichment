# Machine-readable registry of the acceptance gates in tests/ACCEPTANCE_PLAN.md.
#
# Generated once from the frozen plan and then maintained by hand as tests are written:
# fill in `tests` with the test identifiers that actually exercise each gate.
#
# `just acceptance-report` joins real test output against this registry and defaults every
# unmatched gate to `not_run`. A gate becomes `passed` only when a command ran and a log was
# written; `just acceptance-check` enforces that. Gate IDs are stable identifiers -- never
# renumber, never delete, never reuse. Retire by setting `superseded = "<reason>"`.
#
# kind: fixture (deterministic, offline) | live (needs network) | client (needs a real
#       MCP client) | manual (human-verified, must still record a command and a log)

schema_version = "1.0"

[gates.R01]
phase = 1
kind = "fixture"
scenario = "Resolve exact Rust version while a newer release exists"
assertion = "Result retains requested version; upstream version is separate."
tests = []

