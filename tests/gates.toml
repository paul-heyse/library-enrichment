[gates.C14]
phase = 0
kind = "fixture"
scenario = "Tool initializes a stdio connection"
assertion = "Tool list appears without package fetch, build, or LSP startup."
caveat = """\
"No package fetch" is measured as no child process plus an unchanged service-state tree. An \
in-process HTTP call that wrote nothing to $LIBENR_CACHE_HOME would not be caught: there is no \
network isolation in this tier. The child-process check is also a single sample taken after \
tools/list returns, so a subprocess that started and exited within that window is invisible.

The registration is deliberately broader than the assertion. Five of the eleven tests cover MCP \
annotation truthfulness and the daemon-absent service_status path, which are the blueprint's \
§13 Phase-0 clause "service_status truthfully reports absent components" -- a clause the frozen \
ACCEPTANCE_PLAN.md gives no ID of its own. They are filed here so they reach the report at all. \
The cost is that a break in one of them would fail C14 for a reason unrelated to its own \
assertion; the alternative was leaving a blueprint clause evidenced by nothing the report can \
see."""
# The in-process tests prove the catalog is REGISTERED; the stdio-subprocess tests prove it is
# registered CHEAPLY, which is the actual assertion. A fetch, a build or an LSP start would each
# show up as a child process and as a write under $LIBENR_CACHE_HOME, so both are measured
# rather than asserted. Blueprint §14.1 asks for both boundaries.
tests = [
  # In-process: the catalog itself.
  "tests/contract/test_mcp_catalog.py::test_all_nine_tools_are_registered",
  "tests/contract/test_mcp_catalog.py::test_every_tool_declares_an_input_schema",
  "tests/contract/test_mcp_catalog.py::test_verify_usage_is_not_advertised_as_read_only",
  "tests/contract/test_mcp_catalog.py::test_cached_reads_state_their_world_openness_explicitly",
  "tests/contract/test_mcp_catalog.py::test_service_status_is_truthful_when_the_daemon_is_absent",
  # Real stdio subprocess: no fetch, no build, no LSP -- measured.
  "tests/contract/test_stdio_startup.py::test_the_tool_list_appears_over_real_stdio",
  "tests/contract/test_stdio_startup.py::test_listing_tools_starts_no_subprocess",
  "tests/contract/test_stdio_startup.py::test_listing_tools_writes_no_service_state",
  "tests/contract/test_stdio_startup.py::test_the_catalog_appears_within_the_inline_budget",
  "tests/contract/test_stdio_startup.py::test_service_status_works_over_stdio_with_no_daemon",
  "tests/contract/test_stdio_startup.py::test_nothing_is_written_to_protocol_stdout",
]

