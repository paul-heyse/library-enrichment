[gates.R04]
# Re-scoped from phase 1 to phase 0. The blueprint's own Phase-0 gate (§13) ends with "an
# unsupported producer format returns a typed error", which is exactly this assertion, so
# leaving R04 in phase 1 made "Phase 0 complete" unprovable by construction. The ID is
# unchanged -- only the phase field, which is ours and not part of the frozen plan.
phase = 0
kind = "fixture"
scenario = "Unsupported rustdoc JSON format"
assertion = "Typed unsupported-format result; no silent schema misparse."
caveat = """\
The supported set is measured as "deserializes without error", which is necessary but not \
sufficient: rustdoc format changes are largely additive, so a neighbouring version usually \
parses even when a field's meaning has shifted. That is why probe_format checks the version \
BEFORE touching the body, and why widening SUPPORTED_FORMAT_VERSIONS needs a round trip \
checked against known-good output rather than a clean parse. The measurement covers formats \
57, 60 and 61 from committed captures; 59 is the vendored parser's own FORMAT_VERSION and is \
justified by a separate test rather than measured.

The measurement is also one-directional. A fixture that probe_format refuses aborts the test \
before the claimed-vs-parsed comparison, so it detects a supported set that is too NARROW and \
cannot detect one that is too WIDE for a version with no fixture: adding 55 or 58 to the \
constant would pass the whole suite. Only 53 and 999 are pinned as refusals, by unit test. \
tests/ACCEPTANCE_PLAN.md asks for captured artifacts with supported AND unsupported format \
versions; only supported captures are committed, and the unsupported cases are synthetic \
headers -- behaviourally identical for probe_format, which reads only the header, but that is \
what leaves the negative direction unmeasured.

Coverage stops at the RPC boundary: no MCP tool reaches producer.probe_format yet."""
tests = [
  # The ordering guarantee: refuse on the declared version, before any body interpretation.
  "enrichment-core::enrichment_core$producer::rustdoc::tests::an_unsupported_document_is_never_body_parsed",
  "enrichment-core::enrichment_core$producer::rustdoc::tests::an_older_unsupported_version_is_a_typed_refusal",
  "enrichment-core::enrichment_core$producer::rustdoc::tests::a_newer_unsupported_version_is_a_typed_refusal",
  "enrichment-core::enrichment_core$producer::rustdoc::tests::a_missing_format_version_is_refused_rather_than_assumed",
  "enrichment-core::enrichment_core$producer::rustdoc::tests::a_supported_version_is_accepted",
  # A corrupt download and a version mismatch are different facts with different codes.
  "enrichment-core::enrichment_core$producer::rustdoc::tests::a_malformed_artifact_is_distinguished_from_an_unsupported_one",
  # The supported set is measured against real committed captures, not asserted against itself,
  # and the one unmeasured entry is justified rather than assumed.
  "enrichment-core::enrichment_core$producer::rustdoc::tests::the_supported_set_matches_what_the_parser_actually_accepts",
  "enrichment-core::enrichment_core$producer::rustdoc::tests::the_unmeasured_entry_is_the_parsers_own_format_version",
  # And the typed refusal survives the transport.
  "enrichment-daemon::enrichment_daemon$server::tests::an_unsupported_producer_format_is_a_typed_error_over_rpc",
  "enrichment-daemon::enrichment_daemon$server::tests::a_supported_producer_format_is_accepted_over_rpc",
]

