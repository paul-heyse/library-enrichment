[workspace]
resolver = "3"
members = [
  "crates/enrichment-core",
  "crates/enrichment-store",
  "crates/enrichment-daemon",
]
# The acceptance fixture crates are packages under study, not members of this workspace. Each
# declares its own `[workspace]`; excluding them here is what lets `cargo rustdoc` run inside
# one without Cargo deciding it belongs to us (tests/ACCEPTANCE_PLAN.md, "Deterministic
# fixtures").
exclude = ["tests/fixtures/crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paul-heyse/library-enrichment"
publish = false

# Dependency versions are declared here once so the workspace shares one type universe.
# Blueprint §8.4: pin Arrow/DataFusion to a verified mutually compatible set. Pin DataFusion
# FIRST and derive arrow/parquet/object_store from it -- the reverse order fails, and
# deny.toml sets multiple-versions = "deny" so a second arrow major is a hard error.
#
# Verified 2026-09-13 by resolving DataFusion first and reading back what it pulled:
# `cargo add datafusion` -> datafusion 55.1.0, which selects arrow/arrow-schema/parquet 59.3.0
# and object_store 0.13.2. `cargo tree -d` shows NO duplicate arrow/parquet/datafusion/
# object_store major, i.e. a single Arrow type universe.
[workspace.dependencies]
datafusion = "=55.1.0"
deltalake = { version = "1.0.0", git = "https://github.com/delta-io/delta-rs.git", rev = "58f07cd62bfbce3649a7e1c87c696288068ae184", default-features = false, features = ["datafusion", "rustls"] }
arrow = { version = "59.3.0", features = ["canonical_extension_types"] }
arrow-schema = { version = "59.3.0", features = ["canonical_extension_types"] }
parquet = { version = "59.3.0", features = ["arrow_canonical_extension_types"] }
object_store = "=0.13.2"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
async-trait = "0.1.92"
futures = "0.3.34"

# Consumes rustdoc JSON directly, so the public-API projection needs no Cargo build
# (blueprint §4.2). The CLI is deliberately NOT a dependency. Verified 2026-09-13: 0.52.2
# parses every format version we can produce locally -- 57, 60 and 61.
public-api = "0.52.2"

serde = { version = "1", features = ["derive"] }
# `unbounded_depth` exposes `Deserializer::disable_recursion_limit`, which rustdoc JSON needs:
# nested types in real crates exceed serde_json's default depth of 128. public-api already
# enables it, so this changes nothing in the graph; it makes the dependency explicit.
serde_json = { version = "1", features = ["unbounded_depth"] }

# JSON Schema generation from the authoritative Rust wire types (blueprint §6.3). The
# `emit-schemas` binary is the only consumer; schemas/generated/ is never hand-edited.
#
# Verified 2026-09-13: resolves 6 new crates -- schemars, schemars_derive, dyn-clone,
# ref-cast, ref-cast-impl, serde_derive_internals -- each a single version, all MIT or
# `MIT OR Apache-2.0`, all already on deny.toml's licence allowlist. schemars_derive,
# ref-cast-impl and serde_derive_internals all declare `syn = "3"`, so they unify onto the
# 3.0.5 already in the lock; no NEW duplicate major, and no new deny.toml skip is required.
#
# Do NOT enable the `preserve_order` feature. It turns on serde_json/preserve_order for the
# whole workspace through feature unification -- DataFusion included -- and swaps the BTreeMap
# key ordering that makes schema emission byte-reproducible for `git diff --exit-code`.
schemars = "1.2.2"

# Already in Cargo.lock transitively (tokio via DataFusion/object_store, thiserror via
# public-api), so promoting them to direct dependencies adds no new crate except tokio/net's
# mio + socket2. Verified 2026-09-13 with `cargo deny check bans`: still one version of each,
# no new skip required.
#
# The daemon is the single writer and job owner (blueprint §2.1) and will need this runtime for
# Phase 4 job supervision and Phase 6 single-flight; writing the accept loop on it now avoids
# rewriting it then.
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "signal",
  "sync",
  "fs",
  "process",
] }
thiserror = "2.0.20"

# Mints request identities in the core, where §1.1 puts identity. Already in Cargo.lock via
# public-api, so promoting it to a direct dependency adds no crate.
uuid = { version = "1.26.1", features = ["v4"] }

# Reads config/service.*.toml and config/toolchains.toml. `parse` + `serde` only: the `display`
# feature would pull serialization we never use, and `preserve_order` must stay off for the
# same reason it must stay off for serde_json -- see wire::schema's determinism note.
#
# Verified 2026-09-13: adds serde_spanned, toml_datetime, toml_parser and winnow, each a single
# version, all MIT OR Apache-2.0. `cargo deny check bans licenses sources` stays green with no
# new skip.
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

# Phase 1 acquisition and storage. Verified 2026-09-13 against the compatibility matrix rows
# added the same day (docs/architecture/compatibility-matrix.md, "Phase 1 dependencies") and
# recorded in docs/adr/0009. Versions are the newest published on that date; `cargo search`
# and the lockfile agree.
#
# Already in Cargo.lock transitively -- promoting them adds no crate: sha2 (via DataFusion),
# semver (via rustc_version), flate2 (via parquet), url (via object_store), rustdoc-types
# (public-api's own pin, so sharing its `Id` type costs nothing). New subtrees: tar, and the
# HTTP client below.
sha2 = "0.11.0"
bytes = "1.11.1"
semver = "1.0.28"
pep440_rs = "=0.7.3"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1.10"
tar = "0.4.46"
url = "2.5.8"
# docs.rs serves rustdoc JSON zstd-compressed by default (measured 2026-09-13:
# `content-type: application/zstd`). Decoding is bounded; see producer::docsrs::decompress_zstd.
zstd = "0.14.0"

# The HTTP client, used only by the daemon's `fetch` module under the core's FetchPolicy.
#
# `default-features = false` drops charset sniffing and the system proxy. `rustls-no-provider`
# is deliberate: reqwest 0.13's `rustls` feature enables `__rustls-aws-lc-rs`, and aws-lc-sys
# carries a licence deny.toml does not allow. The crypto provider is therefore supplied
# directly -- rustls with `ring` (Apache-2.0 AND ISC, both allowed) -- and installed as the
# process default in enrichment_daemon::fetch. Verified 2026-09-13 from the sparse-index
# feature tables of reqwest 0.13.5 and hyper-rustls 0.27.9.
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "http2",
] }
rustls = { version = "0.23.44", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
# Pinned to exactly what public-api 0.52.2 depends on: `public_api::PublicItem::id()` returns
# this crate's `Id`, and that is the join key between the rendered signature and our normalized
# symbol. A second rustdoc-types version would make the join a compile error, which is the
# right failure -- see enrichment_core::producer::rustdoc's version test.
rustdoc-types = "0.59.0"

# Internal crates carry an explicit version alongside the path. A bare `{ path = ... }` is a
# wildcard requirement, and deny.toml sets `wildcards = "deny"`.
enrichment-core = { path = "crates/enrichment-core", version = "0.0.0" }
enrichment-store = { path = "crates/enrichment-store", version = "0.0.0" }

[profile.dev]
# Evidence snapshots get large; debug info dominates link time without helping much here.
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
