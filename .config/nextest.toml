[profile.default]
# Evidence gaps must be visible; a silently slow test is usually a network call that should
# have been a fixture.
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "immediate-final"
fail-fast = false

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 4 }
failure-output = "immediate-final"
fail-fast = false

# Tests that construct capsules or start a daemon share process-level state; bound them
# so a parallel run cannot make snapshot publication races look like flakes.
[[profile.default.overrides]]
filter = 'test(/^capsule_|^daemon_|^publish_/)'
test-group = "stateful"

[test-groups.stateful]
max-threads = 2

# The real-container tier shares one service-owned Podman root, and its oracles work by
# observing what appears in that root: "exactly one owned container" is only true if nothing
# else is creating one at the same time. Running them one at a time is not a workaround for a
# flaky test -- it is what makes an independent filesystem observation mean anything.
[[profile.default.overrides]]
filter = 'test(/^execution::qualification_tests::/)'
test-group = "containers"
# These start containers, install dependency closures and compile crates. The default 30s
# slow-timeout would terminate them mid-run and call it a failure.
slow-timeout = { period = "300s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'test(/^execution::qualification_tests::/)'
test-group = "containers"
slow-timeout = { period = "300s", terminate-after = 4 }

[test-groups.containers]
max-threads = 1
