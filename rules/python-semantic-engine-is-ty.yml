id: python-semantic-engine-is-ty
language: Python
severity: error
message: Astral ty is this project's Python semantic engine; pyrefly, pyright and mypy are not.
note: |
  Blueprint §1.1 and §5.4 bind the Python semantic engine to ty, used through its CLI/LSP
  boundary. pyrefly is installed on this workstation and globally plugin-enabled in Claude
  Code, and pyright-lsp is too, which makes reaching for them an easy mistake. If ty is
  unavailable the affected gates are `blocked` and it warrants an ADR -- it is never grounds
  for substituting another checker.
rule:
  any:
    - pattern: import pyrefly
    - pattern: import mypy
    - pattern: from pyrefly import $$$
    - pattern: from mypy import $$$
    - pattern: from pyrefly.$$$MOD import $$$
    - pattern: from mypy.$$$MOD import $$$
