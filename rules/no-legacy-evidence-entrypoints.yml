id: no-legacy-evidence-entrypoints
language: Rust
severity: error
message: Use typed producer streams and the admitted native repository; these corpus and sidecar authorities were retired.
files:
  - crates/**/src/**
rule:
  any:
    - kind: identifier
    - kind: field_identifier
    - kind: type_identifier
  regex: '^(ProducerEvidence|NormalizedEvidence|AcquisitionEvent|record_acquisition|all_symbols|all_fragments|parquet_io|source_cache)$'
