id: mcp-generated-component-catalog
language: Python
severity: error
message: Register tools and resources from Rust-generated operation and resource declarations.
files:
  - python/enrichment_mcp/server.py
rule:
  any:
    - pattern: $SERVER.tool($$$ARGS)
    - pattern: $SERVER.resource($$$ARGS)
note: The adapter may construct NativeTool, NativeResourceTemplate and TextResource from generated bindings. Decorators would introduce a second semantic catalog.
