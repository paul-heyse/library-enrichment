id: native-catalog-registration
language: Rust
severity: error
message: Bound sources use immutable inventories; temporary registrations go through native_catalog::work.
files:
  - crates/enrichment-store/src/**
ignores:
  - crates/enrichment-store/src/native_catalog.rs
  - crates/enrichment-store/src/runtime.rs
rule:
  kind: field_identifier
  regex: '^(register_table|register_batch|register_catalog|register_catalog_list|register_schema|register_views|register_leased)$'
