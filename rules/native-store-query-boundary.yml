id: native-store-query-boundary
language: Rust
severity: error
message: Daemon operations must use admitted native store queries, never raw Parquet or a second query engine.
files:
  - crates/enrichment-daemon/src/**
rule:
  any:
    - kind: identifier
    - kind: type_identifier
  regex: '^(ArrowWriter|ParquetRecordBatchReaderBuilder|MemTable|SessionContext|ListingTable|ParquetExec|NormalizeInput)$'
