id: no-previous-research-cursors
language: Rust
severity: error
message: Only the current research cursor generation may be decoded; no previous-generation reader or migration branch.
files:
  - crates/enrichment-core/src/search/**
  - crates/enrichment-core/src/compare/**
rule:
  any:
    - pattern: '$VALUE.strip_prefix("cur_")'
    - pattern: '$VALUE.strip_prefix("search_")'
    - pattern: '$VALUE.strip_prefix("comparison_")'
