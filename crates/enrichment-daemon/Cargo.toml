[package]
name = "enrichment-daemon"
description = "RPC, worker supervision, scheduling, job state, CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
enrichment-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"

# `library-enrichmentd` is on PATH in a dev shell via target/debug (scripts/env.sh), so the
# binary name is what an operator actually types. The crate name stays enrichment-daemon.
[[bin]]
name = "library-enrichmentd"
path = "src/bin/library-enrichmentd.rs"
