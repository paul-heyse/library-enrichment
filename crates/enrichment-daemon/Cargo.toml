[package]
name = "enrichment-daemon"
description = "RPC, worker supervision, scheduling, job state, CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arrow = { workspace = true }
bytes = { workspace = true }
datafusion = { workspace = true }
futures = { workspace = true }
enrichment-core = { workspace = true }
enrichment-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# Outbound HTTP lives here and nowhere else (fetch/); see the workspace note on the pins.
reqwest = { workspace = true }
rustls = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
tempfile = "3.27.0"

[dev-dependencies]
parquet = { workspace = true }

# `library-enrichmentd` is on PATH in a dev shell via target/debug (scripts/env.sh), so the
# binary name is what an operator actually types. The crate name stays enrichment-daemon.
[[bin]]
name = "library-enrichmentd"
path = "src/bin/library-enrichmentd.rs"
