[package]
name = "enrichment-core"
description = "Identities, DTOs, evidence model, producer plans, policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Public-API projection straight from rustdoc JSON, with no Cargo build (blueprint §4.2).
public-api = { workspace = true }
# Direct rustdoc JSON deserialization; the same version public-api pins (see the workspace note).
rustdoc-types = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# Content identities and artifact digests (blueprint §3.1, §6.3).
sha2 = { workspace = true }
# Fetch policy: host classification happens on a parsed URL, never on a string.
url = { workspace = true }
# Safe `.crate` extraction (gzip tar) under an archive policy (§10, gate C11).
flate2 = { workspace = true }
tar = { workspace = true }
# Bounded decoding of docs.rs' zstd-compressed rustdoc JSON.
zstd = { workspace = true }
# Exact-version matching and "newest eligible" ordering (§3.2, gate R01).
semver = { workspace = true }

[dev-dependencies]
# Required by the test asserting SCHEMA_VERSION matches the frozen contract.
serde_json = "1"
tempfile = "3.27.0"
