  - 'let mut text_cache = BTreeMap::new();'
  - 'let mut seen_deliveries = BTreeSet::new();'
  - 'delivery_bytes = delivery_bytes.checked_add(bytes)?;'
  - 'match observation.payload { ExecutionPayload::SemanticQuery(query) => query.document, _ => "" }'
