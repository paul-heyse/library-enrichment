id: native-delivery-borrows-values
valid:
  - 'fn invoke_with_args() { NativeEnvelope::new(field, array, row, request)?; }'
  - 'fn external_reader() { serde_json::from_slice(bytes)?; }'
  - 'mod tests { fn invoke_with_args() { serde_json::from_str(fixture)?; } }'
invalid:
  - 'fn invoke_with_args() { let value = ResultRecord::decode(row)?; }'
  - 'fn invoke_with_args() { let value = record.into_envelope(request); }'
  - 'fn invoke_with_args() { let value = serde_json::from_value(raw)?; }'
