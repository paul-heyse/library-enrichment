id: native-recovery-no-json-authority
valid:
  - 'async fn recover() { let value = catalog.capture_result(&declared).await?; }'
  - 'fn decode_external() { let value = serde_json::from_slice(bytes)?; }'
  - 'async fn publish_completed() { let log = serde_json::to_vec(&capture)?; }'
  - 'mod tests { async fn recover() { let fixture = serde_json::from_str(text)?; } }'
invalid:
  - 'async fn recover() { let receipt = blobs.read_json(artifact, limit)?; }'
  - 'async fn publish_completed() -> Result<()> { let value = serde_json::from_slice(bytes)?; Ok(()) }'
  - 'async fn comparison() { let value: Value = serde_json::from_value(raw)?; }'
