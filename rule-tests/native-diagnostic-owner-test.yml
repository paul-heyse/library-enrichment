id: native-diagnostic-owner
valid:
  - 'crate::native_union! { enum EventPayload { Failure = "failure" { value: crate::wire::Diagnostic => Rule::Text } } }'
  - 'let bytes = serde_json::to_vec(&diagnostic)?;'
invalid:
  - 'struct Failure { recovery_payload: String }'
  - 'crate::native_struct! { pub struct Failure { recovery_payload: String => Rule::Json } }'
