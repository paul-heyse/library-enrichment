id: native-catalog-registration
valid:
  - 'let session = admitted.research_session(runtime, lease).await?;'
  - 'crate::native_catalog::work(session, "page", provider)?;'
invalid:
  - 'session.register_table("symbols", provider)?;'
  - 'catalog.register_schema("evidence", schema)?;'
  - 'session.register_catalog("snapshot", catalog);'
  - 'admitted.register_leased(session, lease)?;'
