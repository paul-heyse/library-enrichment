id: native-export-staging-owner
valid:
  - 'async fn export() { PrivateDirectory::export(&retention, &runtime, parent).await?; }'
  - 'fn scratch() { tempfile::tempdir()?; }'
  - 'mod tests { fn fixture() { tempfile::Builder::new().tempdir_in(parent).unwrap(); } }'
invalid:
  - 'fn stage(parent: &Path) { tempfile::Builder::new().tempdir_in(parent)?; }'
  - 'fn cleanup(path: &Path) { std::fs::remove_dir_all(path)?; }'
