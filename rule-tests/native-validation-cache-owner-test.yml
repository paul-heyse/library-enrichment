id: native-validation-cache-owner
valid:
  - 'struct EvidenceRepository { runtime: QueryRuntime }'
  - 'fn validate(runtime: &QueryRuntime, key: &ValidationKey) { runtime.contracts.validation(key); }'
invalid:
  - 'struct EvidenceRepository { verified_blobs: Arc<Mutex<BTreeMap<String, FileWitness>>> }'
  - 'struct EvidenceRepository { verified_manifests: Arc<Mutex<BTreeSet<String>>> }'
  - 'struct EvidenceRepository { verified_attempts: Arc<Mutex<BTreeMap<String, Vec<Log>>>> }'
