id: native-producer-run-owner
valid:
  - 'async fn publish() { let run = producer_run_plan::compose(runtime, observed, &inputs).await?; }'
  - 'fn fixture() { let run = ProducerRun { inputs, ..observed }; }'
  - 'async fn semantic_inputs() { producer_run_plan::semantic_inputs(runtime, &artifacts, &receipts).await }'
invalid:
  - 'async fn publish_completed() { let run = ProducerRun { inputs, ..observed }; }'
  - 'async fn acquire() { runs.push(ProducerRun { inputs, ..observed }); }'
  - 'fn semantic_inputs() { artifacts.filter(|a| !self.receipt_ids.contains(&a.artifact_id)).collect() }'
