id: native-inspection-result-policy
valid:
  - 'async fn publish() { native::summarize(&facts).await?; store_bytes(bytes)?; }'
  - 'fn fixture() { facts.sort_by_key(|fact| fact.id); let expected = AspectOutcome { state }; }'
  - 'async fn read() { failures.push(Failure { aspect, reason }); }'
invalid:
  - 'fn render() { facts.sort_by(|a,b|a.id.cmp(&b.id)); }'
  - 'async fn publish() { let gap = enrichment_core::evidence::Gap { kind, reason }; }'
  - 'async fn read() { let outcome = AspectOutcome { aspect, state }; }'
