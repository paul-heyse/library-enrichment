id: griffe-static-only
valid:
  - |
      mod = griffe.load(name, search_paths=roots, allow_inspection=False)
  - |
      loader = GriffeLoader(search_paths=roots, allow_inspection=False)
invalid:
  - |
      mod = griffe.load(name)
  - |
      mod = griffe.load(name, search_paths=roots)
  - |
      loader = GriffeLoader(search_paths=roots)
